  labels() { return ["Intro", "How it works", "Receive", "Acknowledge", "The case", "Close", "Report", "Practice"]; }

  /* ---------- original background jazz, synthesized live ---------- */
  bars() {
    // [bass walk (MIDI), chord voicing (MIDI)] — ii-V-I in F with turnarounds, 80 bpm swing
    return [
      [[43, 46, 50, 47], [58, 62, 65, 69]], // Gm9
      [[48, 46, 43, 40], [58, 62, 64, 69]], // C13
      [[41, 45, 48, 49], [57, 60, 64, 67]], // Fmaj9
      [[50, 48, 45, 44], [54, 60, 64, 69]], // D9
      [[43, 46, 50, 47], [58, 62, 65, 69]], // Gm9
      [[48, 46, 43, 40], [58, 62, 64, 69]], // C13
      [[45, 48, 52, 51], [60, 64, 67, 71]], // Am9
      [[50, 48, 45, 44], [54, 60, 64, 69]]  // D9

  }
  hz(m) { return 440 * Math.pow(2, (m - 69) / 12); }
  initAudio() {
    if (this.ctx) return true;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      const ctx = new AC();
      const master = ctx.createGain();
      master.gain.value = 0;
      master.connect(ctx.destination);
      const len = Math.floor(ctx.sampleRate * 1.0);
      const noise = ctx.createBuffer(1, len, ctx.sampleRate);

      this.beat = 0; this.nextT = 0;
      return true;

  }
  pianoNote(m, t, vel, dur) {

    const f = this.hz(m);

    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vel, t + 0.006);
    g.gain.exponentialRampToValueAtTime(vel * 0.3, t + 0.4);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    lp.connect(g); g.connect(this.master);
    [[1, 1], [2, 0.28], [3, 0.08]].forEach((h) => {
      const o = c.createOscillator(); o.type = 'sine'; o.frequency.value = f * h[0];
      const hg = c.createGain(); hg.gain.value = h[1];
      o.connect(hg); hg.connect(lp);
      o.start(t); o.stop(t + dur + 0.05);
    });
  }
  pianoChord(notes, t, vel, dur) {
    notes.forEach((m, i) => this.pianoNote(m, t + i * 0.018, vel, dur));
  }
  tap(t, vol, dur, freq) {
    const c = this.ctx;
    const s = c.createBufferSource(); s.buffer = this.noise;
    const f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = freq;
    const g = c.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.master);
    s.start(t); s.stop(t + dur + 0.02);
  }
  scheduleBeat(i, t) {
    const spb = 60 / 80;
    const sw = spb * 2 / 3;
    const barIx = Math.floor(i / 4) % 8;
    const bar = this.bars()[barIx];
    const b = i % 4;
    this.tap(t, 0.014, 0.25, 7500);
    if (b === 1 || b === 3) {
      this.tap(t + sw, 0.01, 0.18, 7500);
      this.tap(t, 0.012, 0.05, 9500);
    }
    if (b === 0) {
      this.pianoNote(bar[0][0] + 12, t, 0.05, 2.4);
      this.pianoChord(bar[1], t + 0.03, 0.028, 2.2);
    }
    const v = Math.floor(i / 4) % 2;
    if (b === 2 && v === 0) this.pianoChord(bar[1], t + sw, 0.018, 1.2);
    if (b === 1 && v === 1) this.pianoChord(bar[1], t + sw, 0.018, 1.2);

  schedule() {

      this.nextT += 60 / 80;

      this.musicLive = true;
      this.beat = 0;
      this.nextT = c.currentTime + 0.1;
      this.master.gain.cancelScheduledValues(c.currentTime);
      this.master.gain.setValueAtTime(0.0001, c.currentTime);
      this.master.gain.exponentialRampToValueAtTime(0.55, c.currentTime + 1.5);
    }

    if (!this.ctx) return;
    const c = this.ctx;
    this.musicLive = false;
    const now = c.currentTime;
    this.master.gain.cancelScheduledValues(now);

  componentDidMount() {
    this.iv = setInterval(() => this.tick(), 200);
    this.au = setInterval(() => this.schedule(), 60);
  }
  componentWillUnmount() {
    clearInterval(this.iv); clearInterval(this.au); clearTimeout(this.to);
    if (this.ctx) { try { this.ctx.close(); } catch (e) {} }
  }
  tick() {
    const s = this.state;
    if (!s.playing || s.scene < 0) return;
    const d = this.durs();
    const el = s.el + 200;
    if (el >= d[s.scene]) {
      if (s.scene < d.length - 1) this.setState({ scene: s.scene + 1, el: 0 });
      else { this.setState({ el: d[s.scene], playing: false, ended: true }); this.musicStop(3); }
    } else {

    }

    this.musicResume();

  sync(off) {

    const s = this.state;

  }

  }

      s0: vis === 0, s1: vis === 1, s2: vis === 2, s3: vis === 3, s4: vis === 4, s5: vis === 5, s6: vis === 6, s7: vis === 7,
      showCover: !s.started,
      pauseCls: s.playing ? '' : 'paused',
      isPlaying: s.playing,
      notPlaying: !s.playing,
      playLabel: s.playing ? 'Pause' : (s.ended ? 'Replay' : 'Play'),
      progressW: (Math.min(1, done / total) * 100).toFixed(2) + '%',
      timeLabel: this.fmt(done) + ' / ' + this.fmt(total),
      chapters: chapters,
      steps: [1, 2, 3, 4, 5, 6, 7].map((n) => ({ n: n, on: s.started && s.scene >= 0 && s.scene === n })),
      showSubs: s.subsOn && s.started,
      subs: (() => {
        const L = s.scene >= 0 ? this.subLines()[s.scene] : [];
        let act = -1;
        L.forEach((c, i) => { if (s.el >= c[0]) act = i; });
        return L.map((c, i) => ({ text: c[1], on: i === act }));
      })(),
      subsOn: s.subsOn,
      subsLabel: s.subsOn ? 'Hide captions' : 'Show captions',
      subsColor: s.subsOn ? '#8FD16F' : '#A9B8CC',
      toggleSubs: () => this.setState({ subsOn: !this.state.subsOn }),
      musicOn: s.music,
      musicOff: !s.music,
      musicLabel: s.music ? 'Music on' : 'Music off',
      toggleMusic: () => {
        const on = !this.state.music;
        this.setState({ music: on }, () => {
          if (!on) this.musicStop(0.6);
          else if (this.state.playing) this.musicStart();
        });
      },
      togglePlay: () => {
        if (!this.state.started || this.state.ended) this.go(0);
        else {
          const playing = !this.state.playing;
          if (playing) this.musicResume(); else this.musicPause();
          this.setState({ playing: playing });
        }
      },
      replay: () => this.go(0),
      back10: () => this.jump(-10000),
      fwd10: () => this.jump(10000),
      prev: () => this.go(Math.max(0, cur - 1)),
      next: () => this.go(Math.min(d.length - 1, cur + 1))
    };
  }
}

Player.prototype.setState = function (obj, cb) { Object.assign(this.state, obj); this.render(); if (cb) cb(); };
Player.prototype.render = function () {
  const v = this.renderVals();
  const $ = (id) => document.getElementById(id);
  const s = this.state;
  const vis = s.started ? s.scene : -2;
  if (vis !== this._vis) {
    this._vis = vis;
    const tpl = $('scene-' + vis);
    $('sceneHost').innerHTML = tpl ? tpl.innerHTML : '';
  }
  $('stage').classList.toggle('paused', !s.playing);
  $('cover').hidden = !v.showCover;
  const st = v.steps.find((x) => x.on);
  const stn = st ? st.n : 0;
  if (stn !== this._step) { this._step = stn; $('steps').innerHTML = stn ? STEP_HTML.split('{{st.n}}').join(String(stn)) : ''; }
  const sb = v.showSubs ? v.subs.find((x) => x.on) : null;
  const key = sb ? s.scene + '|' + sb.text : '';
  if (key !== this._sub) {
    this._sub = key;
    $('subs').innerHTML = '';
    if (sb) { const d = document.createElement('div'); d.innerHTML = SUB_OPEN + '</div>'; d.firstChild.textContent = sb.text; $('subs').appendChild(d.firstChild); }
  }
  $('prog').style.width = v.progressW;
  $('timeLabel').textContent = v.timeLabel;
  $('playLabel').textContent = v.playLabel;
  $('playBtn').setAttribute('aria-label', v.playLabel);
  $('icoPause').hidden = !v.isPlaying; $('icoPlay').hidden = v.isPlaying;
  $('musicLabel').textContent = v.musicLabel; $('musicBtn').setAttribute('aria-label', v.musicLabel); $('musicBtn').setAttribute('aria-pressed', String(v.musicOn));
  $('icoMusicOn').hidden = !v.musicOn; $('icoMusicOff').hidden = v.musicOn;
  $('subsBtn').setAttribute('aria-label', v.subsLabel); $('subsBtn').setAttribute('aria-pressed', String(v.subsOn)); $('subsIcon').setAttribute('stroke', v.subsColor);
  const ck = v.chapters.map((c) => c.cls).join(',');
  if (ck !== this._chips) {
    this._chips = ck;
    const host = $('chapters'); host.innerHTML = '';
    v.chapters.forEach((c, i) => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'chip ' + c.cls; b.textContent = c.label;
      b.addEventListener('click', () => this.go(i)); host.appendChild(b);
    });
  }
};
const P = new Player();
const call = (k) => () => P.renderVals()[k]();
document.getElementById('coverPlay').addEventListener('click', call('togglePlay'));
document.getElementById('playBtn').addEventListener('click', call('togglePlay'));
document.getElementById('replayBtn').addEventListener('click', call('replay'));
document.getElementById('prevBtn').addEventListener('click', call('prev'));
document.getElementById('back10Btn').addEventListener('click', call('back10'));
document.getElementById('fwd10Btn').addEventListener('click', call('fwd10'));
document.addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') { e.preventDefault(); call('back10')(); } else if (e.key === 'ArrowRight') { e.preventDefault(); call('fwd10')(); } else if (e.key === ' ' && e.target === document.body) { e.preventDefault(); call('togglePlay')(); } });
document.getElementById('nextBtn').addEventListener('click', call('next'));
document.getElementById('musicBtn').addEventListener('click', call('toggleMusic'));
document.getElementById('subsBtn').addEventListener('click', call('toggleSubs'));
P.render();
P.componentDidMount();

</script>
</body>
</html>
